name: Java CI/CD con Maven y Docker

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Compilar y Ejecutar Tests
      run: mvn clean test

  # === FASE 2: DESPLIEGUE CONTINUO (CD) ===
 # === FASE 2: DESPLIEGUE CONTINUO (CD) ===
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # MICROSERVICIO DE PAGOS
    - name: Construir y Subir Imagen - Payment Service
      uses: docker/build-push-action@v5
      with:
        context: ./Payments_Services  # Tu carpeta de pagos
        file: ./Payments_Services/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/payments-service:latest

    # MICROSERVICIO DE USUARIOS
    - name: Construir y Subir Imagen - User Service
      uses: docker/build-push-action@v5
      with:
        context: ./User_Services     # Tu carpeta de usuarios
        file: ./User_Services/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest
    
    # MICROSERVICIO DE GATEWAY
    - name: Construir y Subir Imagen - Gateway Service
      uses: docker/build-push-action@v5
      with:
        context: ./Gateway_Services     # Tu carpeta de gateway
        file: ./Gateway_Services/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/gateway-service:latest