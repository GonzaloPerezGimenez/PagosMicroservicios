name: Java CI/CD con Maven y Docker

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Compilar y Ejecutar Tests
      run: mvn clean test

  # === FASE 2: DESPLIEGUE CONTINUO (CD) ===
  deploy:
    runs-on: ubuntu-latest
    # IMPORTANTE: Solo se ejecuta si la fase 'build-and-test' se pone en verde
    needs: build-and-test
    
    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    # Loguearse en Docker Hub usando los secretos seguros que guardaste
    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Construir y subir la imagen de Docker
    - name: Construir y Subir Imagen Docker
      uses: docker/build-push-action@v5
      with:
        context: .  # Asume que tienes el Dockerfile en la raíz de tu proyecto
        push: true
        # Reemplaza 'tu-usuario-docker' por tu nombre real de usuario de Docker Hub
        # Reemplaza 'nombre-microservicio' por el nombre que quieras darle a la imagen
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:latest